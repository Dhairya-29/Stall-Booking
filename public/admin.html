<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Admin · Hotel Shiv</title><style>
:root{--bg:#eef4fd;--c:#fff;--t:#091540;--m:#5a6591;--p:#1b2cc1;--ln:#09154022}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--t)}header{background:#091540;color:#fff;padding:14px 16px;font-weight:800;font-size:17px}main{max-width:820px;margin:auto;padding:14px}
.tabs,.chips{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.tabs button{flex:1}
button{padding:10px 14px;border:0;border-radius:10px;color:#fff;background:var(--p);font:600 14px inherit;font-family:inherit;cursor:pointer}button.g{background:var(--c);color:var(--t);border:1px solid var(--ln)}button.on{background:var(--p);color:#fff}.a{background:#16a34a}.r{background:#d92d20}
.c{background:var(--c);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 6px #0001}input,textarea{padding:10px;border:1.5px solid var(--ln);border-radius:9px;font:inherit;background:var(--bg);color:var(--t);width:100%}label{font-size:12px;font-weight:600;color:var(--m)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px}
.b{display:inline-block;padding:2px 9px;border-radius:99px;background:#ddd;color:#222;font-size:12px;font-weight:600}.submitted{background:#ffe9a8}.approved{background:#bdf0d0}.rejected{background:#f6c4c4}.held{background:#dde4ff}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.m{color:var(--m)}summary{cursor:pointer;font-weight:600;margin-top:10px}.hide{display:none}
.hdr{display:flex;justify-content:space-between;align-items:center}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:6px 0 12px}.stat{background:var(--c);border-radius:14px;padding:12px 14px;box-shadow:0 1px 6px #0001}.stat b{font-size:22px;display:block}
.bc{display:flex;gap:14px}.th{width:88px;height:116px;border-radius:10px;object-fit:cover;background:var(--bg);border:1px solid var(--ln);cursor:zoom-in;flex:none}.noimg{width:88px;height:116px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--m);flex:none}
.sc{display:inline-block;background:var(--bg);border-radius:99px;padding:1px 9px;font-weight:700;margin:2px 4px 2px 0}.utr{font-family:ui-monospace,monospace;background:var(--bg);padding:2px 8px;border-radius:6px;cursor:pointer}.bd{flex:1;min-width:0}
#lb{position:fixed;inset:0;background:#000d;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}#lb.hide{display:none}#lb img{max-width:100%;max-height:100%;border-radius:10px}
#sq{margin-bottom:8px}
</style></head><body><header class=hdr><span>🛠 Hotel Shiv · Admin</span><button class=g onclick="sessionStorage.clear();location.reload()">Log out</button></header><main>
<div id=rem></div><div class=tabs><button id=t1 onclick="tab(1)">Bookings</button><button id=t2 class=g onclick="tab(2)">Dates & Pricing</button></div>
<div id=v1><div class=stats id=stats></div><input id=sq placeholder='🔍 Search name, phone, UTR or stall' oninput='q=this.value;drawB()'><div class=chips id=fl></div><div id=l></div></div><div id=lb class=hide onclick="this.classList.add('hide')"><img id=lbi></div>
<div id=v2 class=hide><div class=c><b>Add a new date</b><div class=g2 style="margin-top:8px"><div><label>Event name</label><input id=n></div><div><label>Start date</label><input id=d type=date></div><div><label>End date</label><input id=ed type=date></div><div><label>Default price / stall (₹)</label><input id=p type=number min=1></div><div><label>Time</label><input id=tm value='8:00 PM'></div><div><label>Poster / brochure image</label><input id=pf type=file accept=image/*></div><div style='grid-column:1/-1'><label>About</label><textarea id=ab rows=3></textarea></div><button onclick=addEv()>Add</button></div><div class=m style="margin-top:6px">Venue is fixed: Hotel Shiv, Ground Floor Hall</div></div><div id=el></div></div>
<script>
let k=sessionStorage.k||(sessionStorage.k=prompt('Admin password')||''),f='submitted',all=[],evs=[],lay=[];
const $=i=>document.getElementById(i),H=()=>({'x-admin':k,'Content-Type':'application/json'}),rs=n=>'₹'+Number(n).toLocaleString('en-IN');
const J=(u,o={})=>fetch(u,{...o,headers:H()}).then(async r=>{const d=await r.json();if(!r.ok){if(r.status==401){sessionStorage.clear();location.reload()}throw Error(d.error)}return d});
const E=e=>alert(e.message);
const readImg=f=>new Promise(res=>{if(!f)return res(undefined);const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const m=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*m;c.height=i.height*m;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};i.src=r.result};r.readAsDataURL(f)});
function tab(n){$('v1').classList.toggle('hide',n!==1);$('v2').classList.toggle('hide',n!==2);$('t1').className=n===1?'':'g';$('t2').className=n===2?'':'g'}
async function load(){const d=await J('/api/admin/bookings');all=d.bookings;evs=d.events;if(!lay.length)lay=await J('/api/layout');drawRem();const sb=JSON.stringify(all);if(sb!==window._sb){window._sb=sb;drawB()}const sg=JSON.stringify(evs);if(sg!==window._sg){window._sg=sg;drawE()}}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),cache=new Map();let q='';
function thumbs(){document.querySelectorAll('img[data-sh]').forEach(async i=>{const id=i.dataset.sh;if(cache.has(id)){i.src=cache.get(id);return}try{const r=await fetch(`/api/admin/bookings/${id}/screenshot`,{headers:{'x-admin':k}});if(!r.ok)return;const u=URL.createObjectURL(await r.blob());cache.set(id,u);i.src=u}catch(e){}})}
function zoom(id){if(cache.has(id)){$('lbi').src=cache.get(id);$('lb').classList.remove('hide')}}
function copy(t){navigator.clipboard&&navigator.clipboard.writeText(t);}
function drawRem(){const up=evs.filter(e=>!e.ended).sort((x,y)=>x.date.localeCompare(y.date));
 $('rem').innerHTML=up.map(e=>{const live=e.startsIn<=0,col=live?'#15803d':e.startsIn<=3?'#b91c1c':'#b45309',w=live?'🟢 Live now · ends '+(e.endsIn<=0?'today':'in '+e.endsIn+' day'+(e.endsIn>1?'s':'')):'⏰ '+(e.startsIn===1?'Starts tomorrow':'Starts in '+e.startsIn+' days');
  return `<div class=c style="border-left:5px solid ${col}"><div class=row><div><b>${esc(e.name)}</b><div class=m>${e.date}${e.endDate!==e.date?' → '+e.endDate:''}</div></div><div style="text-align:right"><b style="color:${col}">${w}</b><div class=m>${e.booked}/${lay.length} stalls booked · ${e.pending} awaiting approval</div></div></div></div>`}).join('')}
function drawB(){const n=id=>(evs.find(e=>e.id===id)||{}).name||'',vis=all.filter(b=>b.status!=='expired'),cnt=s=>s?all.filter(b=>b.status===s).length:vis.length,ap=all.filter(b=>b.status==='approved');
 $('stats').innerHTML=[['Needs approval',cnt('submitted'),'#b45309'],['Approved',ap.length,'#15803d'],['Stalls booked',ap.reduce((x,b)=>x+b.stalls.length,0),'#1b2cc1'],['Revenue',rs(ap.reduce((x,b)=>x+b.amount,0)),'#091540']].map(([t,v,c])=>`<div class=stat><span class=m>${t}</span><b style="color:${c}">${v}</b></div>`).join('');
 document.title=(cnt('submitted')?'('+cnt('submitted')+') ':'')+'Admin · Hotel Shiv';$('fl').innerHTML=[['submitted','Needs approval'],['approved','Approved'],['rejected','Rejected'],['','All']].map(([s,t])=>`<button class="${f===s?'on':'g'}" onclick="f='${s}';drawB()">${t} (${cnt(s)})</button>`).join('');
 const ql=q.trim().toLowerCase(),L=vis.filter(b=>(!f||b.status===f)&&(!ql||[b.name,b.phone,b.utr,b.stalls.join(' ')].join(' ').toLowerCase().includes(ql)));
 $('l').innerHTML=L.map(b=>`<div class="c bc">${b.shot?`<img class=th data-sh=${b.id} onclick="zoom('${b.id}')" alt="Payment screenshot">`:'<div class=noimg>No screenshot</div>'}<div class=bd>
 <div class=row><div><b>${esc(b.name)}</b> · <a href="tel:${esc(b.phone)}">${esc(b.phone)}</a></div><span class="b ${b.status}">${b.status}</span></div>
 <div class=m>${esc(n(b.eventId))} · ${new Date(b.createdAt).toLocaleString('en-IN')}</div>
 <div style="margin:6px 0">${b.stalls.map(s=>`<span class=sc>${s}</span>`).join('')} <b>${rs(b.amount)}</b></div>
 <div>UTR <span class=utr title="Tap to copy" onclick="copy('${esc(b.utr||'')}')">${esc(b.utr||'—')}</span></div><div style="margin-top:10px">`+
 (b.status==='submitted'?`<button class=a onclick="act('${b.id}','approve')">✓ Approve</button> <button class=r onclick="act('${b.id}','reject')">✕ Reject</button>`:'')+(b.status==='approved'?`<a href=/receipt/${b.id} target=_blank>🧾 Receipt ${b.receiptNo}</a>`:'')+'</div></div></div>').join('')||'<p class=m>Nothing here.</p>';thumbs()}
function drawE(){$('el').innerHTML=[...evs].sort((x,y)=>(x.ended-y.ended)||x.date.localeCompare(y.date)).map((e,i,arr)=>`${e.ended&&(i===0||!arr[i-1].ended)?'<div class=m style="margin:16px 4px 4px;font-weight:700">Ended — hidden from the website, data is kept. To show an event again, change its end date and save.</div>':''}<div class=c data-id=${e.id}${e.ended?' style="opacity:.75"':''}><div class=g2><div><label>Name</label><input class=en value="${e.name}"></div><div><label>Start</label><input class=es type=date value=${e.date}></div><div><label>End</label><input class=ee type=date value=${e.endDate}></div><div><label>Default price / stall (₹)</label><input class=ep type=number value=${e.price}></div><div><label>Time</label><input class=et value="${e.time||''}"></div><div><label>Poster ${e.poster?'(uploaded ✓)':''}</label><input class=ef type=file accept=image/*></div><div style="grid-column:1/-1"><label>About</label><textarea class=ea rows=3>${e.about||''}</textarea></div></div>
 <details ${Object.keys(e.prices).length?'open':''}><summary>Custom price per stall (leave blank to use default)</summary><div class=pg>${lay.map(s=>`<div><label>${s.id}</label><input class=sp data-s=${s.id} type=number min=1 placeholder=${e.price} value="${e.prices[s.id]||''}"></div>`).join('')}</div></details>
 <div style="margin-top:10px"><button onclick="saveEv('${e.id}',this)">Save changes</button> <button class="g" onclick="delEv('${e.id}')">Delete</button></div></div>`).join('')}
async function saveEv(id,btn){const c=btn.closest('.c'),prices={};c.querySelectorAll('.sp').forEach(i=>{if(+i.value>0)prices[i.dataset.s]=+i.value});
 try{const poster=await readImg(c.querySelector('.ef').files[0]);await J('/api/admin/events/'+id,{method:'PUT',body:JSON.stringify({poster,time:c.querySelector('.et').value,about:c.querySelector('.ea').value,name:c.querySelector('.en').value,date:c.querySelector('.es').value,endDate:c.querySelector('.ee').value,price:c.querySelector('.ep').value,prices})});btn.textContent='Saved ✓';setTimeout(()=>btn.textContent='Save changes',1500);load()}catch(e){E(e)}}
async function delEv(id){if(confirm('Delete this date?'))try{await J('/api/admin/events/'+id,{method:'DELETE'});load()}catch(e){E(e)}}
async function addEv(){try{const poster=await readImg($('pf').files[0]);await J('/api/admin/events',{method:'POST',body:JSON.stringify({poster,time:$('tm').value,about:$('ab').value,name:n.value,date:d.value,endDate:ed.value,price:p.value})});n.value=p.value='';load()}catch(e){E(e)}}
async function act(id,a){if(confirm(a==='approve'?'Approve? Check that the amount and UTR match your bank statement and the screenshot.':'Reject this booking and release the stalls?'))try{await J(`/api/admin/bookings/${id}/${a}`,{method:'POST'});load()}catch(e){E(e)}}
load();setInterval(load,6000)</script></main></body></html>
